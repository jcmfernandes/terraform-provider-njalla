[tools]
go = "1.27"
goreleaser = "2"
opentofu = "1"

[tasks.build]
description = "Build the provider binary"
run = "go build -o terraform-provider-njalla"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.testacc]
description = "Run acceptance tests (needs NJALLA_API_TOKEN and NJALLA_TESTACC_DOMAIN)"
env = { TF_ACC = "1", TF_ACC_PROVIDER_HOST = "registry.opentofu.org" }
run = 'TF_ACC_TERRAFORM_PATH="$(command -v tofu)" go test -v ./...'
